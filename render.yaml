# One-click deploy on Render (https://render.com). New → Blueprint → pick this repo.
services:
  - type: web
    name: speakwell
    runtime: node
    plan: free
    branch: claude/speaking-coach-mvp-mfohxm
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
