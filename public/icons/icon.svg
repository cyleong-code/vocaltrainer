<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- deep void background with a holographic bloom -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0714"/>
      <stop offset="0.55" stop-color="#120b2a"/>
      <stop offset="1" stop-color="#05040b"/>
    </linearGradient>
    <radialGradient id="bloom" cx="0.28" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#a66bff" stop-opacity="0.75"/>
      <stop offset="0.35" stop-color="#4f7cff" stop-opacity="0.35"/>
      <stop offset="0.7" stop-color="#2ad1c6" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bloom2" cx="0.85" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#ff5ea8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff5ea8" stop-opacity="0"/>
    </radialGradient>
    <!-- liquid chrome for the capsule -->
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.18" stop-color="#dfe3ee"/>
      <stop offset="0.36" stop-color="#8e95a8"/>
      <stop offset="0.5" stop-color="#f6f7fb"/>
      <stop offset="0.66" stop-color="#6c738a"/>
      <stop offset="0.84" stop-color="#d9dcea"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="chromeDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f3f8"/>
      <stop offset="0.5" stop-color="#737a8f"/>
      <stop offset="1" stop-color="#e6e8f1"/>
    </linearGradient>
    <!-- iridescent neon for the sound arcs -->
    <linearGradient id="neon" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2ad1c6"/>
      <stop offset="0.5" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#ff5ea8"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#bloom)"/>
    <rect width="512" height="512" fill="url(#bloom2)"/>
    <!-- diagonal chrome shards, the y2k cyber texture -->
    <path d="M-40 400 L560 -60 L560 10 L-40 470 Z" fill="#ffffff" opacity="0.05"/>
    <path d="M-40 470 L560 10 L560 40 L-40 500 Z" fill="#ffffff" opacity="0.03"/>
    <path d="M-40 230 L560 -230 L560 -200 L-40 260 Z" fill="#ffffff" opacity="0.04"/>
  </g>

  <!-- sound arcs: three sharp, slanted neon strokes -->
  <g fill="none" stroke="url(#neon)" stroke-linecap="round" filter="url(#glow)">
    <path d="M330 170 q46 86 0 172" stroke-width="16"/>
    <path d="M378 134 q74 122 0 244" stroke-width="12" opacity="0.8"/>
    <path d="M424 100 q98 156 0 312" stroke-width="9" opacity="0.55"/>
  </g>

  <!-- stand -->
  <path d="M156 252 a74 74 0 0 0 148 0" fill="none" stroke="url(#chromeDark)" stroke-width="22" stroke-linecap="round"/>
  <rect x="219" y="326" width="22" height="58" rx="11" fill="url(#chromeDark)"/>
  <rect x="166" y="382" width="128" height="22" rx="11" fill="url(#chrome)"/>

  <!-- capsule -->
  <rect x="180" y="96" width="100" height="196" rx="50" fill="url(#chrome)"/>
  <!-- grille lines etched into the chrome -->
  <g stroke="#2a2d3a" stroke-opacity="0.35" stroke-width="3">
    <line x1="196" y1="150" x2="264" y2="150"/>
    <line x1="194" y1="176" x2="266" y2="176"/>
    <line x1="194" y1="202" x2="266" y2="202"/>
    <line x1="196" y1="228" x2="264" y2="228"/>
  </g>
  <!-- specular highlight -->
  <rect x="196" y="110" width="14" height="150" rx="7" fill="#ffffff" opacity="0.85" filter="url(#soft)"/>
  <!-- neon reflection on the capsule edge -->
  <path d="M276 130 q12 66 0 132" fill="none" stroke="url(#neon)" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
</svg>
